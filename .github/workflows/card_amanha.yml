name: Bia da Orla — tarde (18h)
on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths: ['estudio/**', '.github/workflows/boletim-regional.yml', '.github/workflows/card_amanha.yml']
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar no Instagram
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sulflu-bia
  cancel-in-progress: false
jobs:
  gerar:
    uses: ./.github/workflows/boletim-regional.yml
    with:
      personagem: bia
      publicar: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publicar) }}
    secrets: inherit
