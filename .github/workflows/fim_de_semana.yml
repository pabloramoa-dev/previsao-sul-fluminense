name: Carrossel Fim de Semana (quinta 18h30 BRT)

on:
  # AGENDAMENTO DESLIGADO em 2026-08-14, com base nos numeros de 25/07 a 13/08:
  # alcance mediano 4 e zero interacao em 7 posts.
  # A distribuicao do perfil hoje vem dos Reels; os carrosseis de feed
  # gastavam cota de publicacao da conta e minutos de Actions por ~4 pessoas.
  # Continua disponivel no botao "Run workflow" para disparo manual.
  # PARA RELIGAR: descomente as duas linhas de schedule abaixo.
  # schedule:
  #    - cron: "40 17 * * 4"  # dispara cedo; o job espera ate 21:30 UTC (18:30 BRT quinta)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em modo dry-run (nao publica)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Aguardar o horario alvo (18:30 BRT quinta)
        if: github.event_name == 'schedule'
        run: |
          ALVO=$(date -u -d "today 21:30" +%s)
          AGORA=$(date -u +%s)
          if [ "$AGORA" -lt "$ALVO" ]; then
            ESPERA=$((ALVO - AGORA))
            echo "Runner iniciou cedo. Aguardando $((ESPERA/60)) min ate 21:30 UTC (18:30 BRT quinta)."
            sleep "$ESPERA"
          else
            echo "Runner iniciou $(( (AGORA-ALVO)/60 )) min APOS o alvo. Publicando imediatamente."
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache do Chromium do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Baixar o Chromium (renderiza os cards em HTML)
        run: python -m playwright install --with-deps chromium

      - name: Gerar imagens (sem publicar)
        env:
          PUBLICAR_FASE: gerar
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main fim_semana --dry-run
          else
            python -m src.main fim_semana
          fi

      - name: Commit e push das imagens (antes de publicar)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/output src/estado.json src/historico.json || true
          git commit -m "chore: assets fim de semana $(date -u +%Y-%m-%d)" || echo "Nada para commitar"
          git push || echo "Nada para enviar"

      - name: Aguardar propagacao do raw.githubusercontent
        if: ${{ inputs.dry_run != true }}
        run: sleep 45

      - name: Publicar no Instagram
        if: ${{ inputs.dry_run != true }}
        env:
          PUBLICAR_FASE: publicar
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -c "from src import publicar; publicar.publicar_fila()"
      - name: Avisar falha por e-mail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Previsao Sul Fluminense] FALHOU: ${{ github.workflow }}"
          to: pablo.ramoa@gmail.com
          from: Bot Previsao Sul Fluminense <${{ secrets.MAIL_USERNAME }}>
          body: |
            O workflow "${{ github.workflow }}" falhou e NAO publicou.

            Repositorio: ${{ github.repository }}
            Disparo....: ${{ github.event_name }}
            Log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Se a falha foi no passo "Publicar no Instagram", a causa mais
            provavel e o token (IG_ACCESS_TOKEN) vencido ou invalidado.
