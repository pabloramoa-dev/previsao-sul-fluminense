name: Nina Zuleide Kugutu - converter modelos originais SVG
on:
  push:
    branches: [experimento/nina-zuleide-kugutu-real-20261029]
    paths:
      - "experimentos/kugutu-original/**"
      - ".github/workflows/nina-zuleide-kugutu.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pabloramoa-dev/nina-me-contou
          path: nina_source
          sparse-checkout: motor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências do motor original
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
          python -m pip install -r reels/requirements.txt
      - name: Converter curvas originais Manim em SVG com slots Kugutu
        run: python experimentos/kugutu-original/export_svg_original.py
      - name: Empacotar e validar os dois atores com CLI real Kugutu
        run: |
          npm install -g @kugutu/cli
          for NOME in nina maria; do
            P=experimentos/kugutu-original/source/$NOME
            kugutu validate "$P/character.json"
            kugutu lint "$P/character.json" "$P/artwork.svg"
            kugutu pack "$P/character.json" "$P/artwork.svg" --out "$P/$NOME.charpack"
          done
      - name: Recuperar áudio original com risadas e a linha do tempo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p experimentos/kugutu-original/public
          gh run download 40966728105 -n nina-zuleide-vozes-originais-risadas -D /tmp/nina-zuleide-original
          cp /tmp/nina-zuleide-original/ta_sabendo_nina_zuleide_risadas.mp4 experimentos/kugutu-original/public/source.mp4
          cp /tmp/nina-zuleide-original/timeline.json experimentos/kugutu-original/public/timeline.json
          ffmpeg -y -v error -i experimentos/kugutu-original/public/source.mp4 -vn -ar 44100 -c:a libmp3lame -b:a 128k experimentos/kugutu-original/public/audio.mp3
          cp experimentos/kugutu-original/source/nina/nina.charpack experimentos/kugutu-original/public/nina.charpack
          cp experimentos/kugutu-original/source/maria/maria.charpack experimentos/kugutu-original/public/maria.charpack
          python experimentos/kugutu-original/prepare_envelope.py
      - name: Renderizar MP4 Kugutu real com gestos, emoções e lip-sync
        working-directory: experimentos/kugutu-original
        run: |
          npm install --no-audit --no-fund
          mkdir -p out
          npx remotion render composition.tsx NinaZuleideKugutu out/NINA_ZULEIDE_KUGUTU_ORIGINAL.mp4 --codec h264 --crf 26 --concurrency 2 --log error
          ffprobe -v error -show_entries format=duration,width,height -of default=nw=1 out/NINA_ZULEIDE_KUGUTU_ORIGINAL.mp4
      - name: Entregar artes derivadas dos originais para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kugutu-nina-zuleide-svg-original
          path: |
            experimentos/kugutu-original/source/
            experimentos/kugutu-original/out/NINA_ZULEIDE_KUGUTU_ORIGINAL.mp4
            experimentos/kugutu-original/public/timeline.json
          retention-days: 7
