name: Carrossel Mito ou Verdade (domingo 12h BRT)

on:
  # AGENDAMENTO RELIGADO em 2026-08-22, no mesmo horario de antes.
  # Foi desligado em 2026-08-14 porque entregava alcance mediano 4 e zero interacao em 2 posts.
  # Voltou porque os carrosseis passaram a levar a chamada do robo de DM por
  # bairro no ultimo slide -- conteudo que o Reel sozinho nao entrega.
  # O horario nao mudou: domingo 12h nao competia com Reel nenhum
  # (os Reels sao 06h10 e 18h00). So o gatilho passou a disparar 50 min
  # antes do alvo, em vez de 4 horas antes, pra nao dormir de graca no runner.
  # PARA DESLIGAR: comente as duas linhas de schedule abaixo.
  schedule:
    - cron: "10 14 * * 0"  # dispara cedo; o job espera ate 15:00 UTC (12:00 BRT domingo)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em modo dry-run (nao publica)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Aguardar o horario alvo (12:00 BRT domingo)
        if: github.event_name == 'schedule'
        run: |
          ALVO=$(date -u -d "today 15:00" +%s)
          AGORA=$(date -u +%s)
          if [ "$AGORA" -lt "$ALVO" ]; then
            ESPERA=$((ALVO - AGORA))
            echo "Runner iniciou cedo. Aguardando $((ESPERA/60)) min ate 15:00 UTC (12:00 BRT domingo)."
            sleep "$ESPERA"
          else
            echo "Runner iniciou $(( (AGORA-ALVO)/60 )) min APOS o alvo. Publicando imediatamente."
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache do Chromium do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Baixar o Chromium (renderiza os cards em HTML)
        run: python -m playwright install --with-deps chromium

      - name: Gerar imagens (sem publicar)
        env:
          PUBLICAR_FASE: gerar
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main curiosidade --dry-run
          else
            python -m src.main curiosidade
          fi

      - name: Commit e push das imagens (antes de publicar)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/output src/estado.json src/historico.json || true
          git commit -m "chore: assets curiosidade $(date -u +%Y-%m-%d)" || echo "Nada para commitar"
          git push || echo "Nada para enviar"

      - name: Aguardar propagacao do raw.githubusercontent
        if: ${{ inputs.dry_run != true }}
        run: sleep 45

      - name: Publicar no Instagram
        if: ${{ inputs.dry_run != true }}
        env:
          PUBLICAR_FASE: publicar
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -c "from src import publicar; publicar.publicar_fila()"
      - name: Avisar falha por e-mail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Previsao Sul Fluminense] FALHOU: ${{ github.workflow }}"
          to: pablo.ramoa@gmail.com
          from: Bot Previsao Sul Fluminense <${{ secrets.MAIL_USERNAME }}>
          body: |
            O workflow "${{ github.workflow }}" falhou e NAO publicou.

            Repositorio: ${{ github.repository }}
            Disparo....: ${{ github.event_name }}
            Log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Se a falha foi no passo "Publicar no Instagram", a causa mais
            provavel e o token (IG_ACCESS_TOKEN) vencido ou invalidado.
