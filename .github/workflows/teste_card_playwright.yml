name: TESTE Card HTML com Playwright (nao publica)

# ---------------------------------------------------------------------------
# Workflow de LABORATORIO. Existe so para comparar o card novo (HTML/CSS
# renderizado no Chromium) com os cards atuais feitos em Pillow.
#
# - Nao tem schedule: roda apenas pelo botao "Run workflow".
# - Nao usa nenhum secret e nao chama a API do Instagram.
# - Nao commita nada no repositorio: o resultado sai como artifact.
# - Nao toca em src/, assets/ nem nos workflows de producao.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que gerar"
        required: false
        default: "carrossel_manha"
        type: choice
        options:
          - carrossel_manha
          - carrossel_noite
          - producao_manha
          - producao_noite
          - producao_fim_semana
          - producao_curiosidade
          - producao_alertas
          - producao_tudo
          - cidade
      cidade:
        description: "Cidade do card (use 'todas' para gerar as 5)"
        required: false
        default: "Volta Redonda"

permissions:
  contents: read

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias do projeto
        run: pip install -r requirements.txt

      - name: Instalar o Playwright
        run: pip install "playwright>=1.44,<2"

      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Baixar o Chromium e as libs de sistema
        run: python -m playwright install --with-deps chromium

      - name: Gerar o card
        env:
          MODO: ${{ inputs.modo }}
          CIDADE: ${{ inputs.cidade }}
        run: |
          mkdir -p lab/card_html/saida
          copiar() { cp assets/output/*.jpg lab/card_html/saida/ 2>/dev/null || true; }
          if [ "$MODO" = "producao_manha" ]; then
            python -m src.main manha --dry-run
            copiar
          elif [ "$MODO" = "producao_noite" ]; then
            python -m src.main noite --dry-run
            copiar
          elif [ "$MODO" = "producao_fim_semana" ]; then
            python -m src.main fim_semana --dry-run
            copiar
          elif [ "$MODO" = "producao_curiosidade" ]; then
            python -m src.main curiosidade --dry-run
            copiar
          elif [ "$MODO" = "producao_alertas" ]; then
            python -m src.main alertas --dry-run
            copiar
          elif [ "$MODO" = "producao_tudo" ]; then
            for m in manha noite fim_semana curiosidade alertas; do
              echo "::group::$m"
              python -m src.main "$m" --dry-run || echo "AVISO: o modo $m falhou; seguindo com os outros."
              copiar
              echo "::endgroup::"
            done
          elif [ "$MODO" = "carrossel_manha" ]; then
            python lab/card_html/gerar_card.py --carrossel manha
          elif [ "$MODO" = "carrossel_noite" ]; then
            python lab/card_html/gerar_card.py --carrossel noite
          elif [ "$CIDADE" = "todas" ]; then
            python lab/card_html/gerar_card.py --todas
          else
            python lab/card_html/gerar_card.py --cidade "$CIDADE"
          fi

      - name: Listar o que foi gerado
        run: ls -lh lab/card_html/saida/

      - name: Guardar os cards como artifact
        uses: actions/upload-artifact@v4
        with:
          name: card-playwright
          path: lab/card_html/saida/
          retention-days: 7
          if-no-files-found: error
