name: Nina e Zuleide EP03 - A Entrega Para A Ex (sem publicar)
on:
  push:
    branches: [experimento/nina-zuleide-ep03-entrega-ex-20261030]
    paths:
      - ".github/workflows/nina-zuleide-ep03.yml"
      - "experimentos/trio-original/episodio03_entrega_ex.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Importar motor original da Nina sem vídeos históricos
        uses: actions/checkout@v4
        with:
          repository: pabloramoa-dev/nina-me-contou
          ref: main
          path: nina_source
          filter: blob:none
          sparse-checkout: motor
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar motores originais Manim e Kokoro
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
          python -m pip install -r reels/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dvh_kokoro
          key: kokoro-v1.0
      - name: Baixar risadas CC0 de voz feminina, sem API paga
        run: |
          mkdir -p experimentos/trio-original/build
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 40 -o experimentos/trio-original/build/risada_nina_origem.mp3 https://sfxmint.com/dl/laugh-05.mp3
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 40 -o experimentos/trio-original/build/risada_maria_origem.mp3 https://sfxmint.com/dl/laugh-04.mp3
          ffmpeg -y -loglevel error -i experimentos/trio-original/build/risada_nina_origem.mp3 -ar 44100 -ac 1 -c:a pcm_s16le experimentos/trio-original/build/risada_nina.wav
          ffmpeg -y -loglevel error -i experimentos/trio-original/build/risada_maria_origem.mp3 -ar 44100 -ac 1 -c:a pcm_s16le experimentos/trio-original/build/risada_maria.wav
      - name: Criar falas e antecipação com vozes oficiais
        env:
          PREVISAO_TTS: kokoro
          PYTHONUNBUFFERED: "1"
        run: |
          python experimentos/trio-original/episodio03_entrega_ex.py --prepare
          python - <<'PY'
          import json
          p="experimentos/trio-original/build/timeline.json"
          d=json.load(open(p))
          print(f"Duracao de narracao: {d['duration']:.1f}s; falas: {len(d['timeline'])}")
          assert len(d["timeline"]) >= 40
          assert 125 < d["duration"] < 220, "Roteiro fora do intervalo para piloto de tres minutos"
          PY
      - name: Animar os desenhos originais e diálogos em duplas
        run: |
          manim --disable_caching --fps 24 --resolution 720,1280 \
            experimentos/trio-original/episodio03_entrega_ex.py PortariaSabe
      - name: Montar MP4 vertical com vozes originais e risadas
        run: |
          VIDEO=$(find media/videos -type f -name "PortariaSabe.mp4" | head -1)
          test -n "$VIDEO" && test -s "$VIDEO"
          ffmpeg -y -loglevel error -i "$VIDEO" \
            -i experimentos/trio-original/build/trio_original.wav \
            -map 0:v:0 -map 1:a:0 -vf scale=1080:1920 \
            -r 24 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart -shortest \
            experimentos/trio-original/build/NINA_ZULEIDE_EP03_ENTREGA_EX_ORIGINAL.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            experimentos/trio-original/build/NINA_ZULEIDE_EP03_ENTREGA_EX_ORIGINAL.mp4
      - name: Entregar para avaliação, sem publicação automática
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nina-zuleide-ep03-entrega-ex-mp4
          path: |
            experimentos/trio-original/build/NINA_ZULEIDE_EP03_ENTREGA_EX_ORIGINAL.mp4
            experimentos/trio-original/build/timeline.json
          if-no-files-found: warn
          retention-days: 7
