name: Teste Juarez com Antonio Neural

on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste_antonio_previsaosulflu_rapido.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: reels
    env:
      PREVISAO_ESTILO: vox
      PREVISAO_TTS: edge
      PREVISAO_EDGE_VOICE: pt-BR-AntonioNeural
      PREVISAO_EDGE_RATE: '+10%'
      PREVISAO_EDGE_PITCH: '+6Hz'
      PREVISAO_EDGE_VOLUME: '+6%'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng \
            libpango1.0-dev libcairo2-dev pkg-config
          sudo mkdir -p /usr/share/fonts/truetype/poppins
          for f in Poppins-Bold.ttf Poppins-Regular.ttf; do
            sudo curl -sL -o /usr/share/fonts/truetype/poppins/$f \
              https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/$f
          done
          sudo fc-cache -f

      - name: Dependencias Python
        run: pip install -r requirements.txt

      - name: Conferir roteiro demo
        run: python gerar_juarez.py --demo --so-roteiro

      - name: Gerar Juarez completo com Antonio Neural
        run: python gerar_juarez.py --demo --saida TESTE_JUAREZ_ANTONIO.mp4 --quality m

      - name: Validar audio, timeline e MP4
        run: |
          test -s TESTE_JUAREZ_ANTONIO.mp4
          test -s _trab/narracao.wav
          test -s _trab/segs.json
          python - <<'PY'
          import json
          segs=json.load(open('_trab/segs.json', encoding='utf-8'))
          assert len(segs) >= 5, segs
          assert all(s['fim'] > s['ini'] for s in segs)
          assert all(segs[i]['ini'] >= segs[i-1]['fim'] - 0.01 for i in range(1, len(segs)))
          print('segmentos:', len(segs), 'fim:', segs[-1]['fim'])
          PY
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 TESTE_JUAREZ_ANTONIO.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: teste-juarez-antonio-neural
          path: |
            reels/TESTE_JUAREZ_ANTONIO.mp4
            reels/TESTE_JUAREZ_ANTONIO_preview_720p.mp4
            reels/_trab/segs.json
          retention-days: 7
          if-no-files-found: error
