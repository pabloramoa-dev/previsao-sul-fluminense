name: Estúdio SulFlu
on:
  workflow_call:
    inputs:
      personagem: {required: true, type: string}
      publicar: {required: true, type: boolean}
jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Sao_Paulo
      PERSONAGEM: ${{ inputs.personagem }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pabloramoa-dev/previsao-rj
          ref: 91e8aa72e9947575126a92b53cea8f3c5002fff9
          path: motor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Instalar estúdio do RJ
        working-directory: motor
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libpango1.0-dev libcairo2-dev pkg-config
          pip install -r requirements/test.txt -r requirements/characters.txt num2words requests -r ../reels/requirements.txt
          npm ci --prefix video
          (cd video && npx --no-install hyperframes browser ensure)
          git apply ../estudio/regional.patch
          git apply --check ../estudio/bairros_visual.patch
          git apply ../estudio/bairros_visual.patch
          grep -Fq "'bia': {'nome': 'BIA'," hyperframes/compor.py || { echo 'Nome da apresentadora deve ser somente BIA'; exit 1; }
          git apply ../estudio/vozes.patch
          cp ../estudio/regional.py ../estudio/bairros_foco.py hyperframes/
      - name: Impedir Reel duplicado do mesmo turno
        id: trava_turno
        if: inputs.publicar
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path("data/registro_formatos.json")
          registros = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          dia = datetime.now(ZoneInfo("America/Sao_Paulo")).date()
          turno = "hoje" if os.environ["PERSONAGEM"] == "bira" else "amanha"
          publicado = False
          for registro in registros:
              try:
                  horario = datetime.fromisoformat(registro["publicado_em_utc"]).astimezone(ZoneInfo("America/Sao_Paulo"))
                  if horario.date() == dia and registro.get("quando") == turno and registro.get("media_id"):
                      publicado = True
                      print("Reel do turno ja registrado na Meta:", registro["media_id"])
                      break
              except (KeyError, ValueError, TypeError):
                  continue
          with open(os.environ["GITHUB_OUTPUT"], "a") as saida:
              print(f"pular={'true' if publicado else 'false'}", file=saida)
          PY
      - name: Gerar e validar o boletim regional
        if: steps.trava_turno.outputs.pular != 'true'
        run: |
          quando=hoje
          formato=rio_antes_de_sair
          if [[ "$PERSONAGEM" == bia ]]; then quando=amanha; formato=amanha_no_rio; fi
          python reels/coletar_tempo.py --quando "$quando" --saida "$RUNNER_TEMP/dia.json"
          PYTHONPATH="$GITHUB_WORKSPACE/reels" python motor/hyperframes/gerar_hf.py --snapshot "$RUNNER_TEMP/dia.json" --personagem "$PERSONAGEM" --format "$formato" --out "$GITHUB_WORKSPACE/saida/REEL.mp4"
      - name: Garantir 20–25s, abertura com cidade e capa segura
        if: steps.trava_turno.outputs.pular != 'true'
        run: python tools/finalizar_reel_sulflu.py --video saida/REEL.mp4 --meta saida/REEL.metadata.json
      - uses: actions/upload-artifact@v4
        if: steps.trava_turno.outputs.pular != 'true'
        with:
          name: boletim-${{ inputs.personagem }}
          path: |
            saida/REEL.mp4
            saida/CAPA.jpg
            saida/LEGENDA.txt
            saida/REEL.quality.json
            saida/REEL.sulflu_quality.json
            saida/REEL.metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Validar horario do boletim automatico
        id: janela_turno
        if: inputs.publicar && steps.trava_turno.outputs.pular != 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
        run: |
          python - <<'PY'
          import os, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          agora = datetime.now(ZoneInfo("America/Sao_Paulo"))
          alvo = agora.replace(hour=6 if os.environ["PERSONAGEM"] == "bira" else 18, minute=0, second=0, microsecond=0)
          atraso = (alvo-agora).total_seconds()
          valido = -14400 <= atraso <= 3600
          if valido:
              time.sleep(max(0, atraso))
          else:
              print(f"Turno atrasado ou cedo demais ({agora:%H:%M}); nao publicar previsao vencida.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as saida:
              print(f"ok={'true' if valido else 'false'}", file=saida)
          PY
      - name: Publicar no Instagram do SulFlu
        if: inputs.publicar && steps.trava_turno.outputs.pular != 'true' && steps.janela_turno.outputs.ok != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          tag="boletim-$PERSONAGEM-$GITHUB_RUN_ID"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" saida/REEL.mp4 saida/CAPA.jpg --title "$tag" --notes "Boletim do Sul Fluminense"
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          python reels/postar_reel.py --video "$url/REEL.mp4" --capa-url "$url/CAPA.jpg" --metadata-arquivo saida/REEL.metadata.json --legenda-arquivo saida/LEGENDA.txt
          gh release delete "$tag" --cleanup-tag --yes
      - name: Registrar formato, gancho e ID confirmado
        if: inputs.publicar && steps.trava_turno.outputs.pular != 'true' && steps.janela_turno.outputs.ok != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registro_formatos.json
          git diff --cached --quiet && exit 0
          git commit -m "Registro de formato e gancho [skip ci]"
          git pull --rebase && git push
