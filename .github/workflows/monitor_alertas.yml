name: Monitor de Alertas (a cada 2h, 7h-19h BRT)

on:
  schedule:
    - cron: "0 10-22/2 * * *"   # 07h-19h BRT, de 2 em 2 horas
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em modo dry-run (nao publica)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache do Chromium do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Dependencias de sistema do Chromium (tolerante a falha)
        id: deps
        run: |
          python -m playwright install-deps chromium \
            || echo "::warning::playwright install-deps falhou; seguindo com as libs da imagem do runner"

      - name: Baixar o Chromium (renderiza os cards em HTML)
        id: chromium
        run: python -m playwright install chromium

      - name: Detectar e publicar alertas
        id: detectar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main alertas --dry-run 2>&1 | tee /tmp/alertas.log
          else
            python -m src.main alertas 2>&1 | tee /tmp/alertas.log
          fi

      - name: Coletar motivo da falha
        if: failure()
        id: motivo
        run: |
          if [ "${{ steps.chromium.outcome }}" = "failure" ]; then
            echo "passo=Baixar o Chromium" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.detectar.outcome }}" = "failure" ]; then
            echo "passo=Detectar e publicar alertas" >> "$GITHUB_OUTPUT"
          else
            echo "passo=(anterior ao detector - ver log)" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "trecho<<FIM"
            tail -n 25 /tmp/alertas.log 2>/dev/null || echo "(sem saida capturada)"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - name: Commit estado (anti-spam)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/output src/estado.json || true
          git commit -m "chore: monitor alertas $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nada para commitar"
          git push || echo "Nada para enviar"

      - name: Avisar falha por e-mail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Previsao Sul Fluminense] FALHOU: ${{ github.workflow }}"
          to: pablo.ramoa@gmail.com
          from: Bot Previsao Sul Fluminense <${{ secrets.MAIL_USERNAME }}>
          body: |
            O workflow "${{ github.workflow }}" falhou e NAO publicou.

            PASSO QUE FALHOU: ${{ steps.motivo.outputs.passo }}

            Ultimas linhas da saida:
            ---------------------------------------------
            ${{ steps.motivo.outputs.trecho }}
            ---------------------------------------------

            Repositorio: ${{ github.repository }}
            Disparo....: ${{ github.event_name }}
            Log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
