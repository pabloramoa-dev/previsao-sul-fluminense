name: Alerta SulFlu — checagem diária 14h BRT
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verificar e renderizar sem publicar'
        type: boolean
        default: true
  push:
    paths:
      - 'tools/alerta_14h.py'
      - 'tools/avisos_oficiais.py'
      - 'tests/test_avisos_oficiais.py'
      - 'tools/publicar_alerta_14h.py'
      - 'estudio/alerta_regional.py'
      - 'tests/test_alerta_14h.py'
      - '.github/workflows/monitor_alertas.yml'
permissions:
  contents: write
concurrency:
  group: monitor-alertas-sulflu
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Sao_Paulo
      PREVISAO_RJ_HORA_ALVO: '14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de consulta
        run: pip install requests
      - name: Testar bloqueios e retomada
        run: |
          python -m unittest discover -s tests -p test_alerta_14h.py -v
          python -m unittest discover -s tests -p test_avisos_oficiais.py -v
      - name: Consultar Defesa Civil, INMET e dois modelos nas dez cidades
        id: consulta
        run: |
          python -m tools.alerta_14h
          if [[ "$GITHUB_EVENT_NAME" == "push" && -f "$GITHUB_EVENT_PATH" ]]; then
            if grep -Fq '[publicar-alerta-20-11-2026]' "$GITHUB_EVENT_PATH"; then
              python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path('saida/alertas/consulta.json')
          r = json.loads(p.read_text())
          agora = datetime.now(ZoneInfo('America/Sao_Paulo'))
          validos = [e for e in r['eventos'] if datetime.fromisoformat(e['inicio']).date() == agora.date() and datetime.fromisoformat(e['fim']) > agora]
          if not validos:
              avisos = r['oficiais']['fontes']['inmet']['dados']
              for aviso in avisos:
                  if aviso.get('fonte') != 'INMET' or aviso.get('evento') != 'Tempestade':
                      continue
                  if not (datetime.fromisoformat(aviso['inicio']) <= agora < datetime.fromisoformat(aviso['fim'])):
                      continue
                  if not {'Volta Redonda', 'Barra Mansa', 'Resende'}.issubset(set(aviso['cidades'])):
                      continue
                  r['modo'] = 'aviso_oficial_inmet'
                  r['aviso_oficial'] = aviso
                  r['avisos_oficiais_correspondentes'] = [aviso]
                  validos = [{'tipo': 'temporal', 'local': 'Sul Fluminense',
                              'inicio': aviso['inicio'], 'fim': aviso['fim']}]
                  print('Aviso INMET ativo para hoje: comunicado oficial autorizado')
                  break
          r['eventos'] = validos
          r['publicar'] = bool(validos) and r['oficiais']['completa']
          p.write_text(json.dumps(r, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('publicar=' + str(r['publicar']).lower(), file=f)
          print('Plantão hoje:', len(validos), 'publicar:', r['publicar'])
          PY
            fi
          fi
      - name: Sem risco corroborado
        if: steps.consulta.outputs.publicar != 'true'
        run: |
          echo 'Publicação bloqueada: sem risco corroborado ou consulta oficial incompleta. Consulte o relatório de fontes. Nenhum vídeo será gerado ou publicado.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name != 'push' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-alerta-20-11-2026]')))
        with:
          repository: pabloramoa-dev/previsao-rj
          ref: 91e8aa72e9947575126a92b53cea8f3c5002fff9
          path: motor
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name != 'push' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-alerta-20-11-2026]')))
        with:
          node-version: '24'
      - name: Preparar Bia no estúdio SulFlu
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name != 'push' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-alerta-20-11-2026]')))
        working-directory: motor
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libpango1.0-dev libcairo2-dev pkg-config
          pip install -r requirements/test.txt -r requirements/characters.txt num2words requests -r ../reels/requirements.txt
          npm ci --prefix video
          (cd video && npx --no-install hyperframes browser ensure)
          git apply ../estudio/regional.patch
          git apply ../estudio/vozes.patch
          cp ../estudio/alerta_regional.py hyperframes/regional.py
          python - <<'PY'
          from pathlib import Path
          p = Path('hyperframes/compor.py')
          s = p.read_text().replace('AMANHÃ NO SUL FLU', 'ALERTA NO SUL FLU').replace('AMANHÃ NO SUL FLUMINENSE', 'PLANTÃO SUL FLUMINENSE').replace('PREVISÃO DAS 18H', 'CHECAGEM DAS 14H')
          original = '''f'{esc(c["nome"].upper())} <b>{round(c["min"])}°/{round(c["max"])}°</b>' '''.strip()
          novo = '''f'{esc(c["nome"].upper())} — PREVISÃO DE TEMPO SEVERO' '''.strip()
          if original not in s:
              raise RuntimeError('Ticker do estúdio mudou; revisar antes de publicar')
          s = s.replace(original, novo)
          p.write_text(s)
          PY
      - name: Preparar roteiro do plantão e legenda da publicação
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name != 'push' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-alerta-20-11-2026]')))
        working-directory: motor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hyperframes/gerar_hf.py')
          s = p.read_text()
          a = "        from src.previsao_rj.editorial.formats import prepare"
          b = "        snap, demo = snapshot, False"
          c = "        batidas = prepare(snapshot, formato, topic=topico)['beats']"
          antes = '\n'.join((a, b, c))
          a2 = "        from regional import preparar_boletim"
          b2 = "        snap, _, batidas = preparar_boletim(snapshot, personagem, Path(os.environ['GITHUB_WORKSPACE'])/'saida'/'alertas')"
          c2 = "        demo = False"
          depois = '\n'.join((a2, b2, c2))
          if antes not in s:
              raise RuntimeError('O motor mudou e o plantão requer revisão')
          s = s.replace(antes, depois)
          s = s.replace("'ceu': ceu_do_dia(locs),", "'ceu': 'tempestade' if not locs else ceu_do_dia(locs),")
          p.write_text(s)
          c = Path('hyperframes/compor.py')
          html = c.read_text()
          html = html.replace('quando = "AMANHÃ" if p["formato"] == "amanha_no_rio" else "HOJE"', 'quando = "HOJE"')
          c.write_text(html)
          PY
          echo "PREVISAO_RJ_HORA_ALVO=$(TZ=America/Sao_Paulo date +%H)" >> "$GITHUB_ENV"
      - name: Renderizar somente previsão corroborada
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name != 'push' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-alerta-20-11-2026]')))
        run: |
          python motor/hyperframes/gerar_hf.py --snapshot saida/alertas/consulta.json --personagem bia --format amanha_no_rio --out "$GITHUB_WORKSPACE/saida/alertas/ALERTA.mp4"
      - name: Publicar Reel e Story com recibos independentes
        if: steps.consulta.outputs.publicar == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-alerta-20-11-2026]')))
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          tag="alerta-sulflu-14h-$GITHUB_RUN_ID"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" saida/alertas/ALERTA.mp4 --title "$tag" --notes 'Plantão com previsão corroborada em dois modelos'
          fi
          python -m tools.publicar_alerta_14h --consulta saida/alertas/consulta.json --video "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/ALERTA.mp4" --legenda saida/alertas/LEGENDA.txt
          gh release delete "$tag" --cleanup-tag --yes
      - name: Preservar recibos inclusive em falha parcial
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar-alerta-20-11-2026]')))
        run: |
          if [[ ! -f data/alertas_14h_publicados.json ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/alertas_14h_publicados.json
          git diff --cached --quiet && exit 0
          git commit -m 'Recibos de Reel e Story do alerta 14h [skip ci]'
          git pull --rebase && git push
      - name: Preservar consulta, evidências, vídeo e recibos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerta-14h-${{ github.run_id }}
          path: |
            saida/alertas/
            data/alertas_14h_publicados.json
          if-no-files-found: warn
          retention-days: 3
