name: Monitor de Alertas — Reel regional (7h–19h BRT)
on:
  schedule:
    - cron: "0 10-22/2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Gerar MP4 e capa sem publicar"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: monitor-alertas-sulflu
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências para previsão, card e Reel
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu-core
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Detectar gatilhos reais e produzir Reels de 14s
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python tools/alertas_reel.py --saida saida/alertas --dry-run
          else
            python tools/alertas_reel.py --saida saida/alertas
          fi
      - name: Preservar MP4, capa, legenda e metadados
        uses: actions/upload-artifact@v4
        with:
          name: alertas-sulflu-${{ github.run_id }}
          path: saida/alertas/
          if-no-files-found: error
          retention-days: 3
      - name: Publicar somente alertas disparados
        if: "${{ github.event_name == 'schedule' || inputs.dry_run != true }}"
        env:
          GH_TOKEN: "${{ github.token }}"
          IG_USER_ID: "${{ secrets.IG_USER_ID }}"
          IG_TOKEN: "${{ secrets.IG_ACCESS_TOKEN }}"
        run: |
          shopt -s nullglob
          metadados=(saida/alertas/alerta_*.json)
          if (( ${#metadados[@]} == 0 )); then
            echo "Nenhum alerta válido; nada a publicar"
            exit 0
          fi
          tag="alerta-sulflu-${{ github.run_id }}"
          arquivos=(saida/alertas/alerta_*.mp4 saida/alertas/alerta_*.jpg)
          gh release create "$tag" "${arquivos[@]}" --title "$tag" --notes "Reel de alerta Sul Fluminense"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          for meta in "${metadados[@]}"; do
            nome="$(basename "$meta" .json)"
            python reels/postar_reel.py \
              --video "$url/$nome.mp4" \
              --capa-url "$url/$nome.jpg" \
              --legenda-arquivo "saida/alertas/$nome.txt" \
              --metadata-arquivo "$meta" \
              --sem-stories
          done
          gh release delete "$tag" --cleanup-tag --yes
      - name: Salvar antispam e recibos após publicação confirmada
        if: "${{ success() && (github.event_name == 'schedule' || inputs.dry_run != true) }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/estado.json data/registro_formatos.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Estado e recibos de alertas [skip ci]"
          git pull --rebase && git push
      - name: Diagnóstico da falha
        if: failure()
        run: |
          echo "Alerta não concluído: veja as etapas e os artifacts desta execução." >> "$GITHUB_STEP_SUMMARY"
          echo "Nenhum alerta é marcado como publicado sem confirmação da Meta." >> "$GITHUB_STEP_SUMMARY"
