name: Validar HyperFrames Sul Fluminense
on:
  push:
    branches: [hyperframes-impacto]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVISAO_TTS: edge
      PREVISAO_EDGE_VOICE: pt-BR-AntonioNeural
      PREVISAO_EDGE_RATE: '+10%'
      PREVISAO_EDGE_PITCH: '+6Hz'
      PREVISAO_EDGE_VOLUME: '+6%' 
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libpango1.0-dev libcairo2-dev pkg-config fonts-dejavu-core
          pip install -r reels/requirements.txt
      - name: Render real com dados demonstrativos sem publicação
        working-directory: reels
        run: python ../hyperframes/gerar_hf.py --demo --render TESTE_HYPERFRAMES.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: previsaosulflu-hyperframes-teste
          path: |
            reels/TESTE_HYPERFRAMES.mp4
            hyperframes/build/pacote.json
          if-no-files-found: error
