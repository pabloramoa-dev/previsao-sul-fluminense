# Blueprint do bot de DM e radar colaborativo do @previsaosulflu.
services:
  - type: web
    name: previsaosulflu-dm
    runtime: python
    plan: free
    region: ohio
    rootDir: dm
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook_ig:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: IG_VERIFY_TOKEN
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: RADAR_HASH_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: previsaosulflu-radar
          property: connectionString

databases:
  - name: previsaosulflu-radar
    plan: free
    region: ohio
    databaseName: previsaosulflu
    user: previsaosulflu
